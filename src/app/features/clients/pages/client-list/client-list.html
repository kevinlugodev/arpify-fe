<div class="client-list">
  <app-page-header
    title="Clientes"
    subtitle="Gestiona las empresas clientes de tu organización"
    icon="bi-building"
    actionLabel="Nuevo cliente"
    (actionClick)="onCreate()"
  />

  <app-workflow-tip
    title="Flujo recomendado"
    subtitle="Sigue estos pasos para mantener tu cartera de clientes ordenada."
    [steps]="[
      'Registra la ficha fiscal y comercial',
      'Asigna el contacto principal',
      'Configura la moneda y condiciones de crédito',
      'Consulta el detalle para editar o dar de baja'
    ]"
  />

  <div class="client-list__filters">
    <app-search-field
      class="client-list__search"
      placeholder="Buscar por razón social, nombre comercial o RUC..."
      [value]="searchInput()"
      (valueChange)="searchInput.set($event)"
    />

    <div class="form-field client-list__status">
      <label>Estado</label>
      <app-fluent-dropdown [value]="statusFilter()" (valueChange)="onStatusChange($event)">
        @for (option of statusOptions; track option.value) {
          <fluent-option [value]="option.value">{{ option.label }}</fluent-option>
        }
      </app-fluent-dropdown>
    </div>
  </div>

  @if (customers().length === 0 && !loading()) {
    <app-empty-state
      icon="bi-building"
      title="Aún no hay clientes"
      message="Crea el primer cliente para comenzar a gestionar tu cartera comercial."
      actionLabel="Nuevo cliente"
      (actionClick)="onCreate()"
    />
  } @else {
    <app-data-table
      [columns]="columns"
      [rows]="customers()"
      [loading]="loading()"
      [rowActions]="rowActions"
      [clickable]="true"
      (rowClick)="onRowClick($event)"
      (rowActionClick)="onRowAction($event)"
    />
  }

  <app-confirm-dialog
    #deleteConfirmDialog
    title="Eliminar cliente"
    [message]="'¿Estás seguro de que deseas eliminar a ' + (customerToDelete()?.legal_name ?? 'este cliente') + '? Esta acción no se puede deshacer.'"
    confirmLabel="Eliminar"
    cancelLabel="Cancelar"
    confirmAppearance="danger"
    (confirm)="onConfirmDelete()"
  />
</div>
