<div class="audit">
  <app-page-header
    title="Auditoría"
    subtitle="Registro de acciones del tenant"
    icon="bi-shield-check"
  />

  <app-info-tip message="Esta sección está disponible para roles OWNER y ADMIN. Permite rastrear cambios en entidades del sistema." />

  <section class="audit__filters">
    <div class="audit__filter-row">
      <div class="form-field audit__filter">
        <label>Tipo de entidad</label>
        <app-fluent-dropdown [formField]="filterForm.entityType">
          @for (option of entityTypeOptions; track option.value) {
            <fluent-option [value]="option.value">{{ option.label }}</fluent-option>
          }
        </app-fluent-dropdown>
      </div>

      <div class="form-field audit__filter">
        <label>Acción</label>
        <app-fluent-dropdown [formField]="filterForm.action">
          @for (option of actionOptions; track option.value) {
            <fluent-option [value]="option.value">{{ option.label }}</fluent-option>
          }
        </app-fluent-dropdown>
      </div>

      <div class="form-field audit__filter">
        <label>ID Entidad</label>
        <app-fluent-text-input
          placeholder="UUID de la entidad"
          [formField]="filterForm.entityId"
        />
      </div>

      <div class="form-field audit__filter">
        <label>ID Actor</label>
        <app-fluent-text-input
          placeholder="UUID del usuario"
          [formField]="filterForm.actorId"
        />
      </div>
    </div>

    <div class="audit__filter-actions">
      <fluent-button type="button" appearance="neutral" (click)="clearFilters()">
        Limpiar filtros
      </fluent-button>
    </div>
  </section>

  @if (logs().length === 0 && !loading()) {
    <app-empty-state
      icon="bi-shield-check"
      title="Sin registros"
      message="No hay eventos de auditoría que coincidan con los filtros."
    />
  } @else {
    <app-data-table [columns]="columns" [rows]="logs()" [loading]="loading()" />
  }
</div>
