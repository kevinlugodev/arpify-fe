<div class="dashboard">
  <app-welcome-modal />

  <app-page-header
    title="Inicio"
    subtitle="Resumen de tu espacio de trabajo"
    icon="bi-house"
  />

  <app-info-tip
    message="Este dashboard se conectará en tiempo real con los endpoints de equipos, correos y auditoría. Por ahora muestra un resumen visual de ejemplo."
  />

  <section class="dashboard__stats">
    <app-stat-card
      title="Miembros activos"
      [value]="metrics()?.team_members_not_terminated_count ?? 0"
      icon="bi-people"
      trend="Equipo sin estado terminado"
      [loading]="loadingMetrics()"
    />
    <app-stat-card
      title="Gerencias activas"
      [value]="metrics()?.active_managements_count ?? 0"
      icon="bi-diagram-3"
      trend="Configura en /organizacion"
      [loading]="loadingMetrics()"
    />
    <app-stat-card
      title="Áreas activas"
      [value]="metrics()?.active_areas_count ?? 0"
      icon="bi-building"
      trend="Áreas operativas del tenant"
      [loading]="loadingMetrics()"
    />
    <app-stat-card
      title="Clientes activos"
      [value]="metrics()?.active_customers_count ?? 0"
      icon="bi-briefcase"
      trend="Cartera activa en /clients"
      [loading]="loadingMetrics()"
    />
  </section>

  <section class="dashboard__shortcuts">
    <h3 class="dashboard__section-title">Accesos rápidos</h3>
    <div class="dashboard__cards">
      <a class="dashboard__shortcut" routerLink="/teams">
        <div class="dashboard__shortcut-icon">
          <i class="bi bi-people"></i>
        </div>
        <div class="dashboard__shortcut-content">
          <span class="dashboard__shortcut-title">Gestionar equipos</span>
          <span class="dashboard__shortcut-description">Administra miembros, roles y permisos.</span>
        </div>
        <i class="bi bi-box-arrow-up-right dashboard__shortcut-arrow"></i>
      </a>

      <a class="dashboard__shortcut" routerLink="/organizacion">
        <div class="dashboard__shortcut-icon">
          <i class="bi bi-diagram-3"></i>
        </div>
        <div class="dashboard__shortcut-content">
          <span class="dashboard__shortcut-title">Estructura organizacional</span>
          <span class="dashboard__shortcut-description">Configura gerencias y catálogos base.</span>
        </div>
        <i class="bi bi-box-arrow-up-right dashboard__shortcut-arrow"></i>
      </a>

      <a class="dashboard__shortcut" routerLink="/mass-emails">
        <div class="dashboard__shortcut-icon">
          <i class="bi bi-envelope-paper"></i>
        </div>
        <div class="dashboard__shortcut-content">
          <span class="dashboard__shortcut-title">Correos masivos</span>
          <span class="dashboard__shortcut-description">Crea y programa campañas de correo.</span>
        </div>
        <i class="bi bi-box-arrow-up-right dashboard__shortcut-arrow"></i>
      </a>

      <a class="dashboard__shortcut" routerLink="/me">
        <div class="dashboard__shortcut-icon">
          <i class="bi bi-person"></i>
        </div>
        <div class="dashboard__shortcut-content">
          <span class="dashboard__shortcut-title">Mi perfil</span>
          <span class="dashboard__shortcut-description">Revisa tu cuenta y registros de actividad.</span>
        </div>
        <i class="bi bi-box-arrow-up-right dashboard__shortcut-arrow"></i>
      </a>
    </div>
  </section>
</div>
