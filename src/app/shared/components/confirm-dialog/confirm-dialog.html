<dialog #dialog class="app-confirm-dialog">
  <div class="app-confirm-dialog__content">
    <h3 class="app-confirm-dialog__title">{{ title() }}</h3>
    <p class="app-confirm-dialog__message">{{ message() }}</p>
    <div class="app-confirm-dialog__actions">
      <fluent-button appearance="neutral" (click)="onCancel()">
        {{ cancelLabel() }}
      </fluent-button>
      <fluent-button [appearance]="confirmAppearance()" (click)="onConfirm()">
        {{ confirmLabel() }}
      </fluent-button>
    </div>
  </div>
</dialog>
