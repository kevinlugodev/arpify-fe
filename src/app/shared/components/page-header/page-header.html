<header class="page-header">
  <div class="page-header__content">
    @if (icon()) {
      <i class="bi {{ icon() }} page-header__icon"></i>
    }
    <div class="page-header__text">
      <h1 class="page-header__title">{{ title() }}</h1>
      @if (subtitle()) {
        <p class="page-header__subtitle">{{ subtitle() }}</p>
      }
    </div>
  </div>
  @if (actionLabel() || extraActionLabel()) {
    <div class="page-header__actions">
      @if (extraActionLabel()) {
        <fluent-button [appearance]="extraActionAppearance()" (click)="onExtraActionClick()">{{ extraActionLabel() }}</fluent-button>
      }
      @if (actionLabel()) {
        <fluent-button [appearance]="actionAppearance()" (click)="onActionClick()">{{ actionLabel() }}</fluent-button>
      }
    </div>
  }
</header>
